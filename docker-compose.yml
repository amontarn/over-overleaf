services:
  sharelatex:
    restart: always
    # Server Pro users:
    # image: quay.io/sharelatex/sharelatex-pro
    build:
      context: .
      dockerfile: server-ce/Dockerfile
      args:
        # The published base image currently embeds an obsolete Corepack. The
        # complete CE image has the Node/Corepack versions required by this
        # checkout and is used as the local build base.
        # NOTE: sharelatex/sharelatex is published for linux/amd64 only (no
        # arm64), so it is NOT pinned by digest: a digest forces BuildKit to
        # match the host platform and fails on Apple Silicon. On arm64 it runs
        # under emulation. Pin to a version tag once upstream ships the arch you
        # deploy on.
        OVERLEAF_BASE_TAG: sharelatex/sharelatex:latest
    image: over-overleaf-sharelatex:local
    container_name: sharelatex
    # Resource ceilings so a single runaway compile cannot exhaust the host.
    # Tune to your hardware; raise mem_limit if large documents OOM.
    cpus: 2.0
    mem_limit: 4g
    pids_limit: 4096
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      # Binds to loopback by default; expose it only through a TLS reverse
      # proxy. Override OVERLEAF_HTTP_PORT (e.g. "0.0.0.0:80") to publish wider.
      - "${OVERLEAF_HTTP_PORT:-127.0.0.1:80}:80"
    stop_grace_period: 60s
    volumes:
      - ~/sharelatex_data:/var/lib/overleaf
      ########################################################################
      ####  Server Pro: Uncomment the following line to mount the docker  ####
      ####             socket, required for Sibling Containers to work    ####
      ########################################################################
      # - /var/run/docker.sock:/var/run/docker.sock
    environment:
      OVERLEAF_APP_NAME: "${OVERLEAF_APP_NAME:-Over-Overleaf}"

      OVERLEAF_MONGO_URL: mongodb://mongo/sharelatex

      # Same property, unfortunately with different names in
      # different locations
      OVERLEAF_REDIS_HOST: redis
      REDIS_HOST: redis

      # Required secrets: startup refuses to proceed without them. Generate
      # each with `openssl rand -base64 48`; see .env.example. Never reuse a
      # value across the three, and keep them stable across restarts.
      OVERLEAF_EXTENSIONS_SECRET: "${OVERLEAF_EXTENSIONS_SECRET:?set a long random secret; copy .env.example to .env (openssl rand -base64 48)}"
      OVERLEAF_INVITE_TOKEN_SECRET: "${OVERLEAF_INVITE_TOKEN_SECRET:?set a long random secret; copy .env.example to .env (openssl rand -base64 48)}"
      OVERLEAF_SESSION_SECRET: "${OVERLEAF_SESSION_SECRET:?set a long random secret; copy .env.example to .env (openssl rand -base64 48)}"
      # Distinct internal secret for web<->git-bridge service calls.
      OVERLEAF_GIT_BRIDGE_INTERNAL_SECRET: "${OVERLEAF_GIT_BRIDGE_INTERNAL_SECRET:?set a long random secret; copy .env.example to .env (openssl rand -base64 48)}"
      # Session cookie Secure attribute. Leave this commented out for plain-HTTP
      # local development. Do NOT pass an empty value: on the published base
      # image `secureCookie` is `OVERLEAF_SECURE_COOKIE != null`, so any value
      # (including "") enables Secure and breaks login over plain HTTP.
      # Uncomment only when served over HTTPS:
      # OVERLEAF_SECURE_COOKIE: "true"

      OVERLEAF_GIT_BRIDGE_ENABLED: "${OVERLEAF_GIT_BRIDGE_ENABLED:-true}"
      OVERLEAF_GIT_BRIDGE_PUBLIC_URL: "${OVERLEAF_GIT_BRIDGE_PUBLIC_URL:-http://localhost:8000}"
      OVERLEAF_GIT_BRIDGE_INTERNAL_URL: "http://git-bridge:8000"
      OVERLEAF_WEB_INTERNAL_URL: "http://sharelatex"

      # Direct, explicit GitLab pull/push. Keep private hosts disabled unless
      # the instance must reach a trusted self-hosted GitLab on the LAN.
      OVERLEAF_GITLAB_CONNECTOR_AVAILABLE: "${OVERLEAF_GITLAB_CONNECTOR_AVAILABLE:-true}"
      OVERLEAF_GITLAB_ALLOW_PRIVATE_HOSTS: "${OVERLEAF_GITLAB_ALLOW_PRIVATE_HOSTS:-false}"

      # Local development only: allow the AI connector to reach Ollama on the host.
      # HTTP remains restricted to hostnames resolving exclusively to private addresses.
      OVERLEAF_AI_ALLOW_PRIVATE_HOSTS: "${OVERLEAF_AI_ALLOW_PRIVATE_HOSTS:-true}"
      OVERLEAF_AI_ALLOW_INSECURE_HTTP: "${OVERLEAF_AI_ALLOW_INSECURE_HTTP:-true}"

      ENABLED_LINKED_FILE_TYPES: "project_file,project_output_file"

      # Enables Thumbnail generation using ImageMagick
      ENABLE_CONVERSIONS: "true"

      # Disables email confirmation requirement
      EMAIL_CONFIRMATION_DISABLED: "true"

      ## Set for SSL via nginx-proxy
      #VIRTUAL_HOST: 103.112.212.22

      OVERLEAF_SITE_URL: "${OVERLEAF_SITE_URL:-http://localhost}"
      # OVERLEAF_NAV_TITLE: Overleaf Community Edition
      # OVERLEAF_HEADER_IMAGE_URL: http://example.com/mylogo.png
      # OVERLEAF_ADMIN_EMAIL: support@it.com

      # OVERLEAF_LEFT_FOOTER: '[{"text": "Another page I want to link to can be found <a href=\"here\">here</a>"} ]'
      # OVERLEAF_RIGHT_FOOTER: '[{"text": "Hello I am on the Right"} ]'

      # OVERLEAF_EMAIL_FROM_ADDRESS: "hello@example.com"

      # OVERLEAF_EMAIL_AWS_SES_ACCESS_KEY_ID:
      # OVERLEAF_EMAIL_AWS_SES_SECRET_KEY:

      # OVERLEAF_EMAIL_SMTP_HOST: smtp.example.com
      # OVERLEAF_EMAIL_SMTP_PORT: 587
      # OVERLEAF_EMAIL_SMTP_SECURE: false
      # OVERLEAF_EMAIL_SMTP_USER:
      # OVERLEAF_EMAIL_SMTP_PASS:
      # OVERLEAF_EMAIL_SMTP_TLS_REJECT_UNAUTH: true
      # OVERLEAF_EMAIL_SMTP_IGNORE_TLS: false
      # OVERLEAF_EMAIL_SMTP_NAME: '127.0.0.1'
      # OVERLEAF_EMAIL_SMTP_LOGGER: true
      # OVERLEAF_CUSTOM_EMAIL_FOOTER: "This system is run by department x"

      # ENABLE_CRON_RESOURCE_DELETION: true

      ################
      ## Server Pro ##
      ################

      ## The Community Edition is intended for use in environments where all users are trusted and is not appropriate for
      ## scenarios where isolation of users is required. Sandboxed Compiles are not available in the Community Edition,
      ## so the following environment variables must be commented out to avoid compile issues.
      ##
      ## Sandboxed Compiles: https://docs.overleaf.com/on-premises/configuration/overleaf-toolkit/server-pro-only-configuration/sandboxed-compiles
      # SANDBOXED_COMPILES: "true"
      ### Bind-mount source for /var/lib/overleaf/data/compiles inside the container.
      # SANDBOXED_COMPILES_HOST_DIR_COMPILES: "/home/user/sharelatex_data/data/compiles"
      ### Bind-mount source for /var/lib/overleaf/data/output inside the container.
      # SANDBOXED_COMPILES_HOST_DIR_OUTPUT: "/home/user/sharelatex_data/data/output"
      ### Backwards compatibility (before Server Pro 5.5)
      # DOCKER_RUNNER: "true"
      # SANDBOXED_COMPILES_SIBLING_CONTAINERS: "true"

      ## Works with test LDAP server shown at bottom of docker compose
      # OVERLEAF_LDAP_URL: 'ldap://ldap:389'
      # OVERLEAF_LDAP_SEARCH_BASE: 'ou=people,dc=planetexpress,dc=com'
      # OVERLEAF_LDAP_SEARCH_FILTER: '(uid={{username}})'
      # OVERLEAF_LDAP_BIND_DN: 'cn=admin,dc=planetexpress,dc=com'
      # OVERLEAF_LDAP_BIND_CREDENTIALS: 'GoodNewsEveryone'
      # OVERLEAF_LDAP_EMAIL_ATT: 'mail'
      # OVERLEAF_LDAP_NAME_ATT: 'cn'
      # OVERLEAF_LDAP_LAST_NAME_ATT: 'sn'
      # OVERLEAF_LDAP_UPDATE_USER_DETAILS_ON_LOGIN: 'true'

      # OVERLEAF_TEMPLATES_USER_ID: "578773160210479700917ee5"
      # OVERLEAF_NEW_PROJECT_TEMPLATE_LINKS: '[ {"name":"All Templates","url":"/templates/all"}]'

      # OVERLEAF_PROXY_LEARN: "true"

  mongo:
    restart: always
    # Pinned by digest for reproducible builds (mongo:8.0 at pin time).
    image: mongo:8.0@sha256:5351bff2b5d1563e3fa603a74b9be85ef9323e10aeb0b45cea933a93876e77fd
    container_name: mongo
    cpus: 1.5
    mem_limit: 2g
    pids_limit: 2048
    command: "--replSet overleaf"
    volumes:
      - ~/mongo_data:/data/db
      - ./bin/shared/mongodb-init-replica-set.js:/docker-entrypoint-initdb.d/mongodb-init-replica-set.js
    environment:
      MONGO_INITDB_DATABASE: sharelatex
    extra_hosts:
      # Required when using the automatic database setup for initializing the replica set.
      # This override is not needed when running the setup after starting up mongo.
      - mongo:127.0.0.1
    healthcheck:
      test: echo 'db.stats().ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5

  redis:
    restart: always
    # Pinned by digest for reproducible builds (redis:6.2 at pin time).
    image: redis:6.2@sha256:28df45e148984f73a0468aa28c34a465e7c7c40b53abb5640b7f38c313fddb05
    container_name: redis
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 512
    volumes:
      - ~/redis_data:/data

  git-bridge:
    restart: always
    build:
      context: .
      dockerfile: services/git-bridge-node/Dockerfile
    image: over-overleaf-git-bridge-node:local
    container_name: git-bridge
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 1024
    depends_on:
      sharelatex:
        condition: service_started
    ports:
      # Loopback by default; the public Git endpoint should sit behind the
      # same TLS reverse proxy. Override OVERLEAF_GIT_PORT to publish wider.
      - "${OVERLEAF_GIT_PORT:-127.0.0.1:8000}:8000"
    volumes:
      - ~/git_bridge_data:/data/git-bridge
    environment:
      GIT_BRIDGE_ROOT_DIR: /data/git-bridge
      GIT_BRIDGE_WEB_URL: http://sharelatex
      GIT_BRIDGE_PUBLIC_URL: "${OVERLEAF_GIT_BRIDGE_PUBLIC_URL:-http://localhost:8000}"
      GIT_BRIDGE_INTERNAL_URL: http://git-bridge:8000
      GIT_BRIDGE_INTERNAL_SECRET: "${OVERLEAF_GIT_BRIDGE_INTERNAL_SECRET:?set a long random secret; copy .env.example to .env (openssl rand -base64 48)}"
      GIT_BRIDGE_BRANCH: master
      GIT_BRIDGE_MAX_FILES: 2000
      GIT_BRIDGE_MAX_PROJECT_SIZE: 104857600
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8000/health_check').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  # ldap:
  #    restart: always
  #    image: rroemhild/test-openldap
  #    container_name: ldap

  # See https://github.com/jwilder/nginx-proxy for documentation on how to configure the nginx-proxy container,
  # and https://github.com/overleaf/overleaf/wiki/HTTPS-reverse-proxy-using-Nginx for an example of some recommended
